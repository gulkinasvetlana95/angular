<header>
    @if (!authService.isLoggedIn()){
    <div class="header-container">
       <a routerLink="/">
            <img src="/img/Group.jpg" alt="The Scoville Inferno Logo">
             </a>
            <p class="logo-text">The Scoville Inferno </p>
           
        
        <nav class="header__nav">
            <ul>
                <li><a routerLink="/">Products</a></li>
                <li><a routerLink="/Recipes">Guides & Recipes</a></li>
                <li><a routerLink="/community">Community</a></li>
                <li><a routerLink="/resources">Resources</a></li>
                <li><a routerLink="/contact">Contact</a></li>
            </ul>
        </nav>

         <div class="header__auth-buttons" id="auth-guest">
            <a routerLink="/Login" class="button button--secondary">Sign in</a>
            <a routerLink="/Register" class="button button--primary">Register</a>
        </div>
    </div>
} @else{
    <div class="header-container">
        <a routerLink="/">
            <img src="/img/Group.jpg" alt="The Scoville Inferno Logo"></a>
            <p class="logo-text">The Scoville Inferno </p>
       
        <nav class="header__nav">
             <ul>
                <li><a routerLink="/">Products</a></li>
                <li><a routerLink="/Recipes">Guides & Recipes</a></li>
                <li><a routerLink="/community">Community</a></li>
                <li><a routerLink="/resources">Resources</a></li>
                <li><a routerLink="/contact">Contaсt</a></li>
            </ul>
        </nav>
        
        <div class="user">
            
            <a routerLink="/Account" class="user-icon">
                <img src="/img/User_alt.svg" alt="User Account"></a>
        
            <a routerLink="/Basket" class="cart-icon" aria-label="Shopping Cart">
                <img src="/img/Shopping_bag.svg" alt="Shopping Cart">
            </a>

        </div>
    </div>
}
</header>
