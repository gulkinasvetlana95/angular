
<h1>Shopping Cart</h1>

@if (items.length > 0) {
  <div class="basket-list">
    @for (item of items; track item.product.id) {
      <div class="basket-item">
        <img
          [src]="item.product.image"
          [alt]="item.product.title"
          width="120"
        >

        <div class="basket-item-info">
          <h2>{{ item.product.title }}</h2>
        
          
          <p>
            ${{ (item.product.price * item.quantity).toFixed(2) }}
          </p>
          <div class="btn__total">
            
            <div class="btn__total">
              <button (click)="cartService.removeFromCart(item.product.id)">
                 −
             </button>
             <p> {{ item.quantity }}</p>

             <button (click)="cartService.addToCart(item.product)">
               +
            </button>
            </div>
             <div class="removeBtn">
              <button (click)="removeItem(item.product.id)">
                Remove Х
             </button>
            </div>
          </div>
        
        </div>
      </div>
    }
  </div>

  <div class="basket-total">
    <p>Total</p>
    <h2> ${{ totalPrice.toFixed(2) }}</h2>
  </div>
} @else {
  <p class="basket-empty">Your basket is empty.</p>
}
