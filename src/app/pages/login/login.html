<main class="auth-page-wrapper">
  <div class="auth-background">
    <img src="/img/backgraund.png" alt="Background pattern">
  </div>
  <div class="auth-form-container">
    <div class="auth-container auth-container--login">
      <div class="Legend">
        <h1 class="auth-title">Sign In</h1>
      </div>

      <form class="auth-form" id="login-form" (ngSubmit)="login()">
        <div class="InputField">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" class="Input" [(ngModel)]="email" placeholder="your email" required>
        </div>
        <div class="InputField">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="Input" [(ngModel)]="password" placeholder="password" required>
        </div>

        <div class="ButtonGroup">
          <button type="submit" class="button button--primary">Sign In</button>
        </div>

        <div class="TextLink">
          <a routerLink="/ForgotPassword">Forgot password?</a>
        </div>
      </form>

      <p class="auth-switch">Don’t have an account? <a routerLink="/Register">Sign up</a></p>
    </div>
  </div>
</main>
