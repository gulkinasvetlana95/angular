<main class="auth-page-wrapper">
    <div class="auth-background">
        <img src="/img/backgraund.png" alt="Background pattern">
    </div>
    <div class="auth-form-container">
        <div class="auth-container auth-container--register">
            <div class="Legend">
                <h1 class="auth-title">Register</h1>
            </div>

            <form class="auth-form" id="register-form" (ngSubmit)="register()">
                <div class="InputField">
                    <label for="email" >Email</label>
                    <input type="email" id="email" name="email" [(ngModel)]="email" class="Input" placeholder="alis@gmail.com" required>
                </div>
                <div class="InputField">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" class="Input" [(ngModel)]="password" placeholder="Password" required>
                </div>

                <div class="CheckboxField">
                    <label class="checkbox-container">Remember me
                        <input type="checkbox" checked>
                        <span class="checkmark"></span>
                    </label>
                </div>

                <div class="ButtonGroup">
                    <button type="submit" class="button button--primary">Register</button>
                </div>
            </form>

            <p class="auth-switch">Already have an account? <a routerLink="/Login">Sign in</a></p>
        </div>
    </div>
</main>
